<!-- public/images/logo-hg-animated.svg -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Import de la police Outfit ExtraBold -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800&amp;display=swap');
    </style>
    
    <!-- Dégradé de fond -->
    <linearGradient id="gradHG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fe5d0d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f32c57;stop-opacity:1" />
    </linearGradient>
    
    <!-- Ombre portée du texte -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    /* Style du texte */
    text {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
    }

    /* Animation Cloche (Bell) */
    .animate__bell_sequence {
      animation: bellSwing 10s ease-in-out infinite;
      transform-origin: 50% 40%;
      transform-box: fill-box;
    }

    @keyframes bellSwing {
      /* --- PHASE 1 : Mouvement (0s à 5s) --- */
      0% { transform: rotate(0deg); }
      5% { transform: rotate(15deg); }
      10% { transform: rotate(-12deg); }
      15% { transform: rotate(10deg); }
      20% { transform: rotate(-8deg); }
      25% { transform: rotate(5deg); }
      30% { transform: rotate(-3deg); }
      35% { transform: rotate(1deg); }
      40% { transform: rotate(0deg); }
      
      /* --- PHASE 2 : Pause (5s à 10s) --- */
      50% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
  </style>

  <!-- Fond Carré (Fixe) -->
  <rect x="0" y="0" width="200" height="200" rx="25" ry="25" fill="url(#gradHG)" />
  
  <!-- Texte HG (Animé) -->
  <text 
    class="animate__bell_sequence"
    x="50%" 
    y="50%" 
    dominant-baseline="central" 
    text-anchor="middle" 
    fill="#ffffff" 
    font-size="110" 
    letter-spacing="-18"
    filter="url(#textShadow)"
  >
    HG
  </text>
</svg>